<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="pieceLight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="160" height="110" rx="8" fill="url(#lightGrad)" stroke="#cbd5e1" stroke-width="1"/>
  
  <rect x="8" y="8" width="144" height="94" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="8" y1="36" x2="152" y2="36" stroke="#94a3b8" stroke-width="1"/>
  <line x1="8" y1="55" x2="152" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="8" y1="74" x2="152" y2="74" stroke="#94a3b8" stroke-width="1"/>

  <line x1="44" y1="8" x2="44" y2="102" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="8" x2="80" y2="102" stroke="#94a3b8" stroke-width="1"/>
  <line x1="116" y1="8" x2="116" y2="102" stroke="#94a3b8" stroke-width="1"/>

  <text x="80" y="58" font-size="9" fill="#64748b" font-weight="bold" font-family="'KaiTi', serif" text-anchor="middle" opacity="0.6">楚 河 · 漢 界</text>

  <g filter="url(#shadow)">
    <circle cx="50" cy="55" r="18" fill="url(#pieceLight)" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="50" cy="55" r="15" fill="none" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="50" y="61" font-size="16" fill="#dc2626" font-family="'SimSun', serif" font-weight="900" text-anchor="middle">車</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="110" cy="55" r="18" fill="url(#pieceLight)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="110" cy="55" r="15" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="110" y="61" font-size="16" fill="#1e293b" font-family="'SimSun', serif" font-weight="900" text-anchor="middle">馬</text>
  </g>
</svg>
